name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Repo map covers every folder
        run: node scripts/check-repo-map.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke test (enter every map, 0 errors)
        run: npm run smoke
        env:
          SMOKE_TIMES: night
      - name: Account session smoke (mock backend)
        run: npm run smoke:account
